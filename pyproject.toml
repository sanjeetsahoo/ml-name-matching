[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partial-accept-ops-automation"
version = "0.1.0"
description = "Service to auto-resolve partial name matches and reduce ops tickets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "pydantic-settings",
  "rapidfuzz",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
