[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partial-accepts-ops-reducer"
version = "0.1.0"
description = "Service to auto-resolve ML name-match partial accepts and reduce ops tickets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
